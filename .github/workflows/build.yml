name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          S_STORE: ${{ secrets.SIGNING_STORE_PASSWORD }}
          S_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          S_KEY: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            { echo "SIGNING_STORE_PASSWORD=$S_STORE"; echo "SIGNING_KEY_PASSWORD=$S_KEY"; echo "SIGNING_KEY_ALIAS=$S_ALIAS"; } >> "$GITHUB_ENV"
          elif [ -f signing/release.jks ]; then
            # The key kept in this private repo (see signing/README.md)
            echo "SIGNING_KEYSTORE_PATH=$GITHUB_WORKSPACE/signing/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$(grep '^storePassword=' signing/key.properties | cut -d= -f2-)" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$(grep '^keyPassword=' signing/key.properties | cut -d= -f2-)" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$(grep '^keyAlias=' signing/key.properties | cut -d= -f2-)" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key - the APK is signed with a throwaway debug key"
          fi

      - name: Build
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/PressSheet-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PressSheet-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Press Sheet 1.0.${{ github.run_number }}
          files: out/*.apk
          make_latest: true

  # Installs the APK on an Android emulator, opens it and checks it starts and stays running
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PressSheet-1.0.${{ github.run_number }}
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            mkdir -p shots
            # make Press Sheet the home screen, as on the phone
            adb shell cmd package set-home-activity com.theinkstop.presssheet/.MainActivity || true
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell input keyevent KEYCODE_HOME
            sleep 4
            adb shell am start -W -n com.theinkstop.presssheet/.MainActivity --es theme light
            sleep 30
            adb exec-out screencap -p > shots/1-home-page1.png
            adb shell am start -n com.theinkstop.presssheet/.MainActivity --ei page 1
            sleep 5
            adb exec-out screencap -p > shots/2-home-page2.png
            adb shell am start -n com.theinkstop.presssheet/.MainActivity --es open folder
            sleep 4
            adb exec-out screencap -p > shots/3-folder.png
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell am start -n com.theinkstop.presssheet/.MainActivity --es open drawer
            sleep 5
            adb exec-out screencap -p > shots/4-drawer.png
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb exec-out screencap -p > shots/5-after-home.png
            # swipe left to the next page, like a finger would
            adb shell input swipe 900 1200 150 1200 250
            sleep 2
            adb exec-out screencap -p > shots/6-after-swipe.png
            adb shell am start -n com.theinkstop.presssheet/.MainActivity --es open edit
            sleep 4
            adb exec-out screencap -p > shots/8-customize.png
            adb shell input keyevent KEYCODE_BACK
            sleep 2
            adb shell am start -n com.theinkstop.presssheet/.MainActivity --es theme dark --es open drawer
            sleep 5
            adb exec-out screencap -p > shots/7-drawer-dark.png
            adb shell input keyevent KEYCODE_HOME
            adb shell am start -n com.theinkstop.presssheet/.MainActivity --es theme phone
            sleep 2
            adb logcat -d -v brief | grep -E "AndroidRuntime|FATAL|presssheet|PressSheet" | tail -120 > shots/app-log.txt || true
            echo "----- app log -----"; cat shots/app-log.txt
            adb shell pidof com.theinkstop.presssheet

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/*

      # Keeps the latest test screenshots where they can be looked at: a separate "Test screenshots"
      # entry under Releases, replaced on every build and never marked as the latest version.
      - name: Publish test screenshots
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-screenshots
          name: Test screenshots (latest build)
          prerelease: true
          make_latest: false
          files: shots/*
